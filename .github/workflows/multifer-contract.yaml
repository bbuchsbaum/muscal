name: Pinned multifer contract
# Manual until the pinned upstream revision is published. Public main currently
# lacks the required APIs; do not turn missing capabilities into a green skip.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      MULTIFER_SHA: 8fe24a8a211a4666ef93ccc9c079af477e235336
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::pkgload, local::.
      - name: Install exact supported engine revision
        shell: Rscript {0}
        run: |
          remotes::install_github(paste0("bbuchsbaum/multifer@", Sys.getenv("MULTIFER_SHA")), upgrade = "never")
      - name: Assert capabilities and exercise real inference routes
        run: Rscript dev/check_multifer_contract.R
